[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "motor-aquai"
version = "0.1.0"
description = "Cálculos de acueducto y alcantarillado — RAS 2000 / Resolución 0330-2017 (11 módulos: población, caudales, redes, tratamiento PTAP/PTAR, tarifas CRA)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9.2",
    "reportlab>=4.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.3"]
