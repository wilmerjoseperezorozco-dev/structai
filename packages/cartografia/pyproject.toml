[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cartografia"
version = "0.1.0"
description = "Georreferenciación oficial IGAC (EPSG:9377, CTM12) con origen local para CAD/IFC, metadatos DXF/IFC y catálogo estándar de capas (issue #211)"
requires-python = ">=3.11"
dependencies = [
    "pyproj>=3.6",
    "ezdxf>=1.3",
    "ifcopenshell>=0.8",
    "numpy",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.3"]
