[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eval-stats"
version = "0.1.0"
description = "Estadística para evaluar sistemas RAG: IC bootstrap, pruebas pareadas (t, Wilcoxon, McNemar), tamaños de efecto y corrección Holm (issue #95)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.13",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.3"]
