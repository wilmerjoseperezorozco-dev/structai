# ══════════════════════════════════════════════════════════════
# INGENIERA NSR-10 PLATFORM — docker-compose (desarrollo local)
# Costo: $0 — todo local. Para GCP: migrar a Cloud Run + Cloud SQL
# ══════════════════════════════════════════════════════════════
version: '3.9'

services:

  # ── Frontend Next.js ──────────────────────────────────────
  # NO se dockeriza a propósito: apps/web está conectado directo a Vercel
  # (import nativo de Git, ver comentario en .github/workflows/ci.yml) y
  # nunca tuvo un apps/web/Dockerfile real -- el servicio "web" que
  # existía aquí referenciaba un Dockerfile que nunca se creó. Correr el
  # frontend en local: `npm run dev` dentro de apps/web.

  # ── API FastAPI (Motor APU + RAG) ─────────────────────────
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    ports: ["8000:8000"]
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      - API_SECRET=${API_SECRET}
    volumes:
      - ./apps/api:/app
      - ./packages:/packages
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # ── N8N (Bot Telegram + Workflows) ────────────────────────
  # Removido 2026-08-02: montaba ./n8n/workflows, carpeta que nunca
  # existió en el repo (huérfano desde el commit inicial). El n8n real
  # del proyecto de "Agentes empresa" corre self-hosted aparte, no aquí.

  # ── Redis (caché Motor APU) ────────────────────────────────
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  # ── Qdrant (BIM Intelligence — vector store) ──────────────
  # v1.7.4 -> v1.9.7 (2026-08-26): parcha CVE-2024-3829 (lectura/escritura
  # arbitraria de archivos vía symlinks maliciosos en snapshots, crítico,
  # https://github.com/wilmerjoseperezorozco-dev/structai/security/dependabot/44)
  # -- servicio experimental sin wiring a producción (ver README.md), pero
  # el parche es gratis y cierra la alerta real de todas formas.
  qdrant:
    image: qdrant/qdrant:v1.9.7
    ports:
      - "6333:6333"   # REST + Dashboard → http://localhost:6333/dashboard
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334

volumes:
  redis_data:
  qdrant_data:
