# ══════════════════════════════════════════════════════════════
# CI/CD — GitHub Actions (gratis hasta 2000 min/mes en repos privados)
# Trigger: push a master, Pull Requests
#
# Deploy: NO se hace aquí a propósito.
#   - apps/web ya está conectado por Git directo a Vercel (import nativo,
#     no vía Action) — cada push a master dispara su propio deploy solo.
#     Duplicarlo aquí con una acción de deploy causaría dos despliegues
#     compitiendo por la misma build.
#   - apps/api corría en DigitalOcean App Platform con auto-deploy nativo
#     en cada push a master. Cutover real a Google Cloud Run (2026-09-01,
#     us-east1, servicio structai-api) — a diferencia de DO, Cloud Run NO
#     tiene todavía un trigger de CI/CD automático (Cloud Build desde
#     GitHub, pendiente de armar), así que hoy el deploy de apps/api es
#     manual (gcloud builds submit + gcloud run deploy), no dispara con
#     este workflow ni con el push a master. DigitalOcean sigue existiendo
#     como respaldo apagado por decisión propia (saldo vencido no pagado a
#     propósito), sin tráfico real desde el cutover.
#   - Migraciones de Supabase: NO se automatizan aquí (nota actualizada
#     2026-08-20 — la nota anterior de "solo 1 migración vieja" quedó
#     obsoleta: infra/supabase/migrations/ ya tiene las 65 migraciones
#     reales versionadas, ver infra/supabase/SCHEMA.md). Se sigue sin
#     automatizar `supabase db push` aquí porque cualquier cambio de
#     schema nuevo se aplica primero vía MCP contra la base real y
#     verificado a mano — automatizarlo en CI aplicaría cambios de
#     schema sin ese paso de verificación humana antes de tocar
#     producción.
#     en Supabase — correr `supabase db push --linked` contra eso sería
#     inseguro hasta que las migraciones reflejen el estado real.
# ══════════════════════════════════════════════════════════════
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  # 22, no 20: @supabase/* (auth-js/functions-js/postgrest-js/realtime-js/
  # storage-js/supabase-js, todos 2.110.5) ya requieren Node >=22 (EBADENGINE
  # confirmado en los logs reales de CI, 2026-09-02) -- Node 20 seguía
  # "funcionando" con warnings, pero ya no es lo que el proyecto necesita.
  # OJO: esto por sí solo NO arregla "Lint & Type Check (web)" -- ver el
  # paso "Actualizar npm" en ese job para la causa real de por qué llevaba
  # días fallando (confirmado con Node 22, sigue el mismo `npm ci` roto).
  NODE_VERSION: 22
  PYTHON_VERSION: '3.12'

jobs:

  # ── 1. Lint + Type Check (apps/web) ─────────────────────────
  lint-web:
    name: 🔍 Lint & Type Check (web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json
      # Causa real (confirmada 2026-09-02) de que este job llevara días
      # fallando con "Missing: rollup@4.63.1 from lock file": no es un
      # lockfile roto -- `npm ci` limpio (node_modules borrado) pasa
      # perfecto con npm 11.11.0 local, pero falla con el npm 10.9.8 que
      # trae Node 22 en el runner. Es el bug conocido de npm con
      # optionalDependencies de binarios de plataforma de rollup 4.x
      # (@sentry/nextjs fija rollup a la anidada 4.63.0/^4.60.3), que
      # varias versiones de npm 10.x resuelven distinto a npm 11.x. Fix:
      # forzar un npm moderno antes de `npm ci`, no confiar en el que
      # trae el runner.
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit

  # ── 2. Auditoría de dependencias (apps/web) ─────────────────
  # No bloquea el pipeline a propósito. Actualizado 2026-08-26 (repaso
  # general de la app) — la nota anterior, del 2026-07-13, ya estaba
  # desactualizada: hablaba de 10 vulnerabilidades de 2 paquetes y de una
  # migración (next 14→"next-pwa mantenido") que YA se hizo. Estado real
  # verificado hoy: 30 vulnerabilidades (26 moderadas + 4 altas),
  # confirmado con `npm audit fix --dry-run` que NINGUNA tiene un fix sin
  # breaking change hoy — las 30 salen de 3 paquetes raíz:
  #   1. next (arrastra postcss con XSS/path-traversal) — fix real es
  #      next 16.x.
  #   2. @sentry/nextjs (arrastra rollup/uuid con path-traversal) — fix
  #      real es @sentry/nextjs 10.x.
  #   3. @ducanh2912/next-pwa (el fork mantenido que reemplazó al next-pwa
  #      original, arrastra workbox-build/serialize-javascript) — sigue
  #      con una RCE real (GHSA-5c6j-r48x-rmvq) pese a la migración.
  # Ninguna es un `npm audit fix` seguro de correr a ciegas — las tres
  # requieren migración con QA propio. Dependabot (alertas + PRs
  # automáticos de seguridad) se activó en el repo el mismo día — es la
  # red de seguridad real para no perder de vista nuevas vulnerabilidades,
  # este job queda como reporte informativo en cada corrida.
  audit-web:
    name: 🛡️ npm audit (informativo)
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}' }
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm audit --audit-level=high

  # ── 3. Build (apps/web) ──────────────────────────────────────
  build-web:
    name: 🏗️ Build (web)
    runs-on: ubuntu-latest
    needs: [lint-web]
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL:      ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_API_URL:           ${{ secrets.NEXT_PUBLIC_API_URL }}

  # ── 4. Tests Python — motores con cobertura real ────────────
  # Cada paquete corre en SU PROPIO working-directory: todos tienen una
  # carpeta llamada literalmente "src", así que correr pytest desde la
  # raíz del repo colisiona el nombre de módulo entre paquetes (import
  # cacheado del primer "src" que se procesa, verificado localmente).
  #
  # Actualizado 2026-08-02: la matriz solo corría motor-apu, motor-
  # deformacion y motor-topovia (prototipo abandonado, ver limpieza de
  # hoy — nunca se volvió a tocar desde el commit inicial). El comentario
  # viejo decía que aquai/geopot/vias quedaban fuera porque sus tests/
  # estaban vacíos — eso ya no es cierto: los 5 motores de abajo tienen
  # tests reales (70%-96% cobertura, ver CONTRIBUTING.md) que CI nunca
  # había corrido ni una sola vez.
  test-motores:
    name: 🧮 Tests Python — motores
    runs-on: ubuntu-latest
    strategy:
      matrix:
        paquete: [motor-apu, motor-deformacion, motor-aquai, motor-geopot, motor-vias, motor-gerencia, motor-estructural]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '${{ env.PYTHON_VERSION }}' }
      - name: Instalar dependencias
        working-directory: packages/${{ matrix.paquete }}
        run: |
          pip install pytest
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          elif [ -f pyproject.toml ]; then
            # motor-aquai/geopot/vias/gerencia/estructural solo declaran deps
            # en pyproject.toml (sin requirements.txt) -- pip install -e no
            # funciona todavía en estos paquetes (ver CONTRIBUTING.md), así
            # que se extraen las dependencias declaradas e instalan directo,
            # mismo patrón documentado ahí para instalación manual.
            python -c "import tomllib; d = tomllib.load(open('pyproject.toml','rb')); print('\n'.join(d['project'].get('dependencies', [])))" > /tmp/deps.txt
            [ -s /tmp/deps.txt ] && pip install -r /tmp/deps.txt
          fi
      - name: Correr pytest
        working-directory: packages/${{ matrix.paquete }}
        run: pytest tests/ -v

  # ── 5. Tests de integración — apps/api (RAG, rate limit, health) ──
  test-api:
    name: 🧪 Tests de integración (apps/api)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '${{ env.PYTHON_VERSION }}' }
      - name: Instalar dependencias
        working-directory: apps/api
        run: pip install -r requirements.txt
      # rag_multi_norma.py fuerza HF_HUB_OFFLINE=1 al importarse (correcto:
      # /ask y /consultar nunca deben depender de la red en producción — el
      # Dockerfile ya hornea AMBOS modelos en la imagen por el mismo motivo,
      # ver apps/api/Dockerfile). Un runner de CI nuevo nunca los descargó,
      # así que cada test que importa rag_multi_norma fallaba con
      # LocalEntryNotFoundError -- causa real de que CI llevara varios días
      # en rojo (embeddings: encontrado 2026-08-09; reranker: encontrado
      # 2026-09-02, mismo bug de fondo que ya se había parchado en el
      # Dockerfile de Cloud Run el 2026-09-01 -- commit 407a347 -- pero
      # nunca se replicó aquí porque el reranker se agregó DESPUÉS del
      # primer fix de este workflow, el 2026-08-27, y nadie volvió a
      # revisar este paso). Se cachea entre corridas para que esto solo
      # pese la primera vez.
      - name: Cachear modelos (HF — embeddings + reranker)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-embeddings-minilm-l12-v2_reranker-mmarco-mminilmv2-l12-h384-v1
      - name: Descargar modelos (si no están en caché)
        run: |
          python -c "from sentence_transformers import SentenceTransformer; SentenceTransformer('paraphrase-multilingual-MiniLM-L12-v2')"
          python -c "from sentence_transformers import CrossEncoder; CrossEncoder('cross-encoder/mmarco-mMiniLMv2-L12-H384-v1')"
      - name: Correr pytest
        working-directory: apps/api
        run: pytest -v
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GROQ_API_KEY:         ${{ secrets.GROQ_API_KEY }}
          # Respaldo de 2 niveles (Groq -> OpenAI), NVIDIA retirado el
          # 2026-08-20 por inconsistencia de latencia (20s-199s en pruebas
          # reales, ver rag_multi_norma.py). Sin esto, si Groq se queda sin
          # cuota a mitad de la corrida (pasó real el 2026-08-17 y de nuevo
          # el 2026-08-20/21, runs 32444349247/32444843901: 25 tests caían
          # con "Groq y el respaldo OpenAI no pudieron generar una
          # respuesta") el respaldo se quedaba sin credencial en CI y no
          # podía activarse -- el secret OPENAI_API_KEY ya está configurado
          # en el repo desde el 2026-08-20 (y en Google Secret Manager para
          # producción, desde el cutover a Cloud Run del 2026-09-01), esta
          # línea lo activa también aquí.
          OPENAI_API_KEY:       ${{ secrets.OPENAI_API_KEY }}
