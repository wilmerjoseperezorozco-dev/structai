# Actualizaciones de versión. Las alertas de seguridad de GitHub funcionan aparte; esto agrega PRs de actualización.
# Para no inundar el repositorio: semanal, agrupado por menor/parche y con tope de PRs abiertos.
version: 2
updates:
  - package-ecosystem: pip
    directory: /apps/api
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 3
    labels: [dependencias]
    groups:
      python-menores:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /apps/web
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 3
    labels: [dependencias]
    groups:
      npm-menores:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    labels: [dependencias]
